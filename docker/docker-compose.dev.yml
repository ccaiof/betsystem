services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: betsystem-keycloak
    command: start-dev
    environment:
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: betsystem-app
    environment:
      APP_ENV: development

      KEYCLOAK_ISSUER: http://keycloak:8080/realms/betsystem
      KEYCLOAK_CLIENT_ID: betsystem-api

    ports:
      - "8081:8080"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak_data:
