services:
  ministack:
    image: ministackorg/ministack:1.5
    container_name: betsystem-ministack
    environment:
      PERSIST_STATE: 1
      LOG_LEVEL: INFO
      MINISTACK_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ministack_data:/tmp/ministack-state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: betsystem-keycloak
    command: start-dev
    environment:
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development  
    container_name: betsystem-app
    environment:
      APP_ENV: development

      KEYCLOAK_ISSUER: http://keycloak:8080/realms/betsystem
      KEYCLOAK_CLIENT_ID: betsystem-api

    ports:
      - "8081:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      ministack:
        condition: service_healthy
    volumes:
      - ..:/app
      - go_cache:/go

volumes:
  keycloak_data:
  go_cache:
  ministack_data:
